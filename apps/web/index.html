<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#111315" />
    <meta name="description" content="Confidence — concurrent agents, inspectable evidence, one exact release." />
    <title>Confidence · Agent collaboration</title>
    <script id="theme-bootstrap">
      (() => {
        let theme = 'dark';
        try { if (localStorage.getItem('confidence.theme') === 'light') theme = 'light'; } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#111315' : '#f6f7f9');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
