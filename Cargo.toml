[workspace]
members = ["crates/protocol", "crates/verifier-cli", "crates/project-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
